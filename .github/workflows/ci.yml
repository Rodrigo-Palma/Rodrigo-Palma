name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Single lockfile
        # Vercel installs with npm, so package-lock.json is the only lockfile.
        run: |
          for f in bun.lock bun.lockb yarn.lock pnpm-lock.yaml; do
            if [ -e "$f" ]; then
              echo "::error::$f found; npm (package-lock.json) is the only package manager"
              exit 1
            fi
          done
          test -f package-lock.json
      - uses: actions/setup-node@v7
        with:
          # Same major as Vercel: read from engines.node ("22.x").
          node-version-file: package.json
          cache: npm
      - name: Node version
        run: node --version | grep -q '^v22\.'
      - name: Install dependencies
        # react-text-loop pins a pre-18 React peer range; the app itself runs on 18.
        run: npm ci --legacy-peer-deps
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: "true"
      - name: Build
        run: npm run build
        env:
          SKIP_PREFLIGHT_CHECK: "true"
          GENERATE_SOURCEMAP: "false"
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          retention-days: 1

  links:
    # Dead links in the README, CV and site sources fail the run (config: lychee.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml README.md cv/resume.html src public/index.html
          fail: true
        env:
          # Authenticated requests avoid GitHub's anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    # Accessibility below 0.95 fails; SEO and performance only warn,
    # since their scores drift on shared runners (config: lighthouserc.json).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 7
