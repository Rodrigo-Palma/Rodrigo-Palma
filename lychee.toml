# Link checker config for the site (README, CV, React sources, HTML shell).
# Used by the `links` job in .github/workflows/ci.yml.

# Any 4xx/5xx fails the run; 429 is a rate limit, not a dead link.
accept = ["200..=299", "429"]

max_retries = 3
retry_wait_time = 5
timeout = 20
max_concurrency = 8

# Cache results between CI runs (restored by actions/cache).
cache = true
max_cache_age = "1d"
# Only successes are cached: a failure is always re-checked on the next run.
cache_exclude_status = ["400..", "..200"]

no_progress = true

# Default set plus the React sources under src/.
extensions = ["md", "html", "css", "scss", "txt", "xml", "js", "jsx"]

exclude = [
  # LinkedIn answers 999 to any non-browser client.
  '^https?://(www\.)?linkedin\.com',
  # Preconnect origins, not pages: the bare host has no document.
  '^https://fonts\.gstatic\.com/?$',
  '^https://fonts\.googleapis\.com/?$',
  # XML namespace and DTD identifiers, not links.
  '^http://www\.w3\.org/2000/svg',
  '^http://www\.sitemaps\.org/schemas/',
  # CRA build-time placeholder in public/index.html (resolved by the build).
  '%PUBLIC_URL%',
  # JS template literal, resolved at runtime.
  '\$(\{|%7B)',
]
